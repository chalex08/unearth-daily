# Runs on every push and every pull request. The `checks` job is the
# required status check for `main` (see CONTRIBUTING.md).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Validate puzzles
        run: npm run validate:puzzles
      - name: No free-tier Gemini key in the app (SPEC §5.3)
        run: '! grep -rn GEMINI_FREE src'
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
