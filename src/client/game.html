<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="Unearth: ten chained clues, one answer each, and rarer answers dig deeper."
    />
    <link rel="stylesheet" href="game.css" />
    <title>Unearth</title>
  </head>

  <body>
    <div id="world" aria-hidden="true"></div>
    <div id="flash" class="keep-motion" aria-hidden="true"></div>
    <div id="app">
      <header id="hud" hidden>
        <span id="pickaxes" role="img"></span>
        <ol id="pips"></ol>
        <span id="score" class="num"></span>
      </header>

      <div id="status" class="recess" hidden>
        <p id="status-text" role="status">Loading…</p>
        <button id="retry" type="button" hidden>Try again</button>
      </div>

      <main id="play" class="recess" hidden>
        <ol id="chain" aria-label="Your core sample so far" tabindex="0"></ol>
        <div id="current">
          <p id="layer"></p>
          <p id="clue"></p>
          <p id="helper">Every clue above still applies.</p>
        </div>
        <div id="reveal" hidden>
          <img
            id="reveal-icon"
            src="icons/00-surface.svg"
            alt=""
            width="32"
            height="32"
          />
          <p id="reveal-band"></p>
          <p id="reveal-answer"></p>
          <p id="reveal-points">
            <span id="reveal-base" class="block num"></span>
            <span id="reveal-bonus" class="block num"></span>
          </p>
          <p id="reveal-flavour"></p>
        </div>
        <form id="answer-form" autocomplete="off">
          <p id="result" role="status"></p>
          <label for="answer" class="visually-hidden">Your answer</label>
          <input
            id="answer"
            aria-describedby="layer clue"
            name="answer"
            type="text"
            maxlength="40"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
            enterkeyhint="go"
            placeholder="One answer"
          />
          <button id="dig" type="submit">Dig</button>
        </form>
      </main>

      <main id="end" class="recess" hidden>
        <div id="end-head">
          <img
            id="end-icon"
            src="icons/00-surface.svg"
            alt=""
            width="48"
            height="48"
          />
          <h1 id="end-title"></h1>
        </div>
        <p id="end-total" class="num"></p>
        <label for="share">Your result, spoiler-free</label>
        <textarea id="share" rows="3" readonly></textarea>
        <button id="copy" type="button">Copy result</button>
        <p id="next"></p>
        <dl id="end-stats"></dl>
        <ol id="end-chain" aria-label="Your core sample"></ol>
        <p id="end-note" hidden></p>
        <p id="final-answer"></p>
      </main>

      <!-- The fossils in the rock, as text: shown in the desktop side panel, for screen readers only
           on phones (the canvas can't be reached by keyboard). -->
      <section id="fossils" aria-labelledby="fossils-title" hidden>
        <h2 id="fossils-title">Other diggers' answers</h2>
        <ul id="fossil-list" tabindex="0"></ul>
      </section>
    </div>
    <!-- One live region, always rendered: changes inside hidden elements aren't announced. -->
    <p id="announce" class="visually-hidden" role="status"></p>
    <script type="module" src="game.ts"></script>
  </body>
</html>
